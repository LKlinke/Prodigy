[mypy]
# The pGCL front end taken over from probably (prodigy/pgcl except pgcl_checks.py and
# pgcl_operations.py) is not type-checked yet, and the code that uses it sees its names as Any,
# as before, when it was the installed package probably without type information.
# Checking it reports about 1200 errors, mostly in Prodigy's use of the AST.
exclude = (?x)^prodigy/pgcl/(__init__\.py|ast/|check\.py|compiler\.py|parser\.py|substitute\.py|util/|pysmt/)

[mypy-prodigy.pgcl,prodigy.pgcl.ast,prodigy.pgcl.ast.*,prodigy.pgcl.check,prodigy.pgcl.compiler,prodigy.pgcl.parser,prodigy.pgcl.substitute,prodigy.pgcl.util,prodigy.pgcl.util.*,prodigy.pgcl.pysmt,prodigy.pgcl.pysmt.*]
follow_imports = skip

[mypy-click.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True

[mypy-symengine.*]
ignore_missing_imports = True

[mypy-pysmt.*]
ignore_missing_imports = True
