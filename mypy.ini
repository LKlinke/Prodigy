[mypy]
# an ignore that is no longer needed is an error (#379, step 2)
warn_unused_ignores = True
# a name is re-exported only if its package lists it in __all__ (#379, step 1)
no_implicit_reexport = True
check_untyped_defs = True
# every function of prodigy is annotated (#379, stage 2)
disallow_untyped_defs = True

[mypy-click.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True

[mypy-pysmt.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-networkx.*]
ignore_missing_imports = True

# no stubs yet (#379, stage 3, in LKlinke/prodigy-ginac-bindings)
[mypy-prodigy_ginac.*]
ignore_missing_imports = True
