[mypy]

# The distribution engines use the pGCL AST (prodigy/pgcl) without narrowing its sum types
# (Expr, Instr) first, e.g. condition.lhs.rhs after a check like check_is_modulus_condition.
# These error codes are switched off per module until they are typed (follow-up of #86);
# remove a module's section once it passes.
[mypy-prodigy.distribution.distribution]
disable_error_code = union-attr, arg-type, index

[mypy-prodigy.distribution.generating_function]
disable_error_code = union-attr, arg-type, index, operator, override

[mypy-prodigy.distribution.fast_generating_function]
disable_error_code = union-attr, index, operator, override

[mypy-prodigy.distribution.symengine_distribution]
disable_error_code = union-attr, arg-type, index, operator

[mypy-click.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True

[mypy-symengine.*]
ignore_missing_imports = True

[mypy-pysmt.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
