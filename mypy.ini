[mypy]
check_untyped_defs = True

[mypy-click.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True

[mypy-symengine.*]
ignore_missing_imports = True

[mypy-pysmt.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-prodigy.pgcl.*]
disallow_untyped_defs = True

[mypy-prodigy.analysis.lowerbounds.*]
disallow_untyped_defs = True

[mypy-prodigy.cli]
disallow_untyped_defs = True
