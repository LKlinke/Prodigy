[mypy]
check_untyped_defs = True
# every function of prodigy is annotated (#379, stage 2)
disallow_untyped_defs = True

[mypy-click.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True

[mypy-symengine.*]
ignore_missing_imports = True

[mypy-pysmt.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
