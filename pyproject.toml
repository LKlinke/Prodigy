[project]
# "prodigy" is taken on PyPI; the import name and the command stay prodigy
name = "prodigy-ppl"
# From the latest Git tag v<version> (hatch-vcs, see [tool.hatch.version])
dynamic = ["version"]
description = "PRObability DIstributions via GeneratingfunctionologY: analysis of probabilistic programs with generating functions"
readme = "README.md"
authors = [
    { name = "Lutz Klinkenberg", email = "lutz.klinkenberg@cs.rwth-aachen.de" }
]
requires-python = ">=3.11"
dependencies = [
    # parser of prodigy/pgcl
    "lark>=1.2,<2",
    # type checker of prodigy/pgcl
    "frozendict>=2.3,<3",
    "algebraic-data-types>=0.1.3,<0.3",
    "attrs>=19.3.0",
    "pysmt>=0.9.0,<0.10",
    "click>=8.1,<9",
    "networkx>=3.2,<4",
    "sympy>=1.8,<2",
    "matplotlib>=3.4.2,<4",
    "Flask>=3.0,<4",
    # 0.14 has wheels for Python 3.14
    "symengine>=0.14.0,<0.16",
    "setuptools>=76.0.0,<85",
    # lower-bound modes (prodigy.analysis.lowerbounds): HiGHS LP solver (scipy), exact rational linear algebra (FLINT)
    "numpy>=1.26",
    "scipy>=1.11",
    "python-flint>=0.6",
    # The GiNaC engine (--engine ginac). Its wheels bundle GiNaC; the marker leaves out the platforms and Python
    # versions without wheels, where pip would build the sdist (needs a C++17 compiler, CMake and GiNaC).
    # A marker cannot tell musllinux from glibc, so on Alpine pip still tries to build it.
    "prodigy-ppl-ginac>=0.0.5,<0.1; python_version < '3.15' and (sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')))",
]

[project.optional-dependencies]
# The GiNaC engine on every platform, built from the sdist where no wheel exists
ginac = ["prodigy-ppl-ginac>=0.0.5,<0.1"]

[project.urls]
Repository = "https://github.com/LKlinke/Prodigy"

[project.scripts]
prodigy = "prodigy.cli:cli"

[dependency-groups]
dev = [
    # pytest 7.2 rewrites assertions with ast.Str, which Python 3.14 removed; 8.4 is the first release for 3.14
    "pytest>=8.4",
    "pylint>=4.1,<5",
    "mypy>0.770",
    "yapf>=0.30.0,<0.44",
    "jinja2==3.1.6",
    "rope>=0.17.0,<1.16",
    # pytest-cov < 5 uses hook markers that pytest 9 deprecates and pytest 10 removes
    "pytest-cov>=5",
    # hypothesis 5 registers a pytest plugin that fails to load on Python >= 3.12 (importlib.metadata)
    "hypothesis>=6",
    # `make test` runs the tests in parallel workers (-n auto --dist worksteal)
    "pytest-xdist>=3.6",
]
# `make docs` (docs/source); not installed by default, `uv run --group docs` adds it
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4",
    # Sphinx 9.0, the last 9.x for Python 3.11, fails to format the signatures of enum members; 3.11 gets 8.2
    "sphinx>=8.2,!=9.0.*",
    "sphinx-autodoc-typehints>=3",
    "sphinx-click>=6",
]

[tool.uv]
# uv.lock was created with uv 0.11; the CI uses the newest uv that satisfies this.
required-version = ">=0.11"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests", "prodigy"]
addopts = ["--doctest-modules"]
# A test that runs longer than 10 minutes prints the stack of every thread, so a hang shows where it is.
faulthandler_timeout = 600
# tests/fuzzing and tests/simulation/test_examples.py (`-m "not fuzz"` leaves them out)
markers = ["fuzz: property-based fuzzing and differential tests against the simulator"]

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version comes from the latest tag v<version> (e.g. v3.1.0 gives 3.1.0, a later commit 3.1.1.devN+g<hash>).
# Only tags v* count; other tags such as OOPSLA24 are ignored. Without .git (Docker builds) the version is passed
# in SETUPTOOLS_SCM_PRETEND_VERSION.
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"
raw-options = { git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"] }

[tool.hatch.build.hooks.vcs]
# Each build (also uv sync's editable install) writes the version here; prodigy_version() reads it when the
# package metadata is missing, e.g. when the sources run without being installed. It is in .gitignore.
version-file = "prodigy/_version.py"

[tool.hatch.build]
# Build the ignored version file into the wheel and the sdist
artifacts = ["prodigy/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["prodigy"]

[tool.hatch.build.targets.wheel.force-include]
# The example library of the web GUI (prodigy/web/examples.py finds it next to the package)
"pgfexamples" = "prodigy/pgfexamples"

[tool.hatch.build.targets.sdist]
only-include = ["prodigy", "pgfexamples", "tests", "README.md", "LICENSE"]
