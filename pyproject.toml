[project]
name = "prodigy"
version = "3.0.0"
description = "PRObability DIstributions via GeneratingfunctionologY: analysis of probabilistic programs with generating functions"
readme = "README.md"
authors = [
    { name = "Lutz Klinkenberg", email = "lutz.klinkenberg@cs.rwth-aachen.de" },
    { name = "Philipp Schröer", email = "mail@philworld.de" },
]
requires-python = ">=3.11"
dependencies = [
    # parser of prodigy/pgcl
    "lark>=1.2,<2",
    # type checker of prodigy/pgcl
    "frozendict>=2.3,<3",
    "algebraic-data-types>=0.1.3,<0.2",
    "attrs>=19.3.0",
    "pysmt>=0.9.0,<0.10",
    "click>=8.1,<9",
    "networkx>=3.2,<4",
    "sympy>=1.8,<2",
    "matplotlib>=3.4.2,<4",
    "pygin @ git+https://github.com/LKlinke/prodigy-ginac-bindings.git@dynamic-variables",
    "Flask>=3.0,<4",
    # 0.14 has wheels for Python 3.14
    "symengine>=0.14.0,<0.15",
    "setuptools>=76.0.0,<77",
    # lower-bound modes (prodigy.analysis.lowerbounds): HiGHS LP solver (scipy), exact rational linear algebra (FLINT)
    "scipy>=1.11",
    "python-flint>=0.6",
]

[project.scripts]
prodigy = "prodigy.cli:cli"

[dependency-groups]
dev = [
    # pytest 7.2 rewrites assertions with ast.Str, which Python 3.14 removed; 8.4 is the first release for 3.14
    "pytest>=8.4",
    "pylint>=2.5.2,<3",
    "mypy>0.770",
    "yapf>=0.30.0,<0.31",
    "jinja2==3.1.4",
    "rope>=0.17.0,<0.18",
    # pytest-cov < 5 uses hook markers that pytest 9 deprecates and pytest 10 removes
    "pytest-cov>=5",
    # hypothesis 5 registers a pytest plugin that fails to load on Python >= 3.12 (importlib.metadata)
    "hypothesis>=6",
    # For `make docs` (not installed):
    # sphinx-autodoc-typehints ^1.25.3, sphinx-bootstrap-theme ^0.8.1, sphinx-click ^5.0.0, sphinx-git 11.0.0,
    # and sphinxcontrib-applehelp 2.0.0, -devhelp 2.0.0, -htmlhelp 2.1.0, -qthelp 2.0.0, -serializinghtml 2.0.0
    # (https://stackoverflow.com/questions/77848565/sphinxcontrib-applehelp-breaking-sphinx-builds-with-sphinx-version-less-than-5-0)
]

[tool.uv]
# uv.lock was created with uv 0.11; the CI uses the newest uv that satisfies this.
required-version = ">=0.11"

[tool.pytest.ini_options]
testpaths = ["tests", "prodigy"]
addopts = ["--doctest-modules"]
# A test that runs longer than 10 minutes prints the stack of every thread, so a hang shows where it is.
faulthandler_timeout = 600

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# pygin is installed from GitHub
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["prodigy"]
