[tool.poetry]
name = "prodigy"
version = "3.0.0"
description = ""
authors = ["Lutz Klinkenberg <lutz.klinkenberg@cs.rwth-aachen.de>", "Philipp Schröer <mail@philworld.de>"]

[tool.poetry.dependencies]
python = "^3.11.0"
lark-parser = "^0.8.5"
algebraic-data-types = "^0.1.3"
attrs = "^19.3.0"
pysmt = "^0.9.0"
click = "^7.1.2"
# sphinxcontrib-katex = "^0.7.1"
graphviz = "^0.15"
networkx = "2.5"
sympy = "^1.8"
matplotlib = "^3.4.2"
probably = { git = "https://github.com/Philipp15b/probably.git", branch = "brand-new" }
pygin = { git = "https://github.com/LKlinke/prodigy-ginac-bindings.git", branch = "dynamic-variables" }
# Resolves to Flask 2.0.x: Flask >= 2.1 needs click 8, but probably pins click 7.
Flask = "^2.0.0"
# < 3: Flask 2.0 imports url_quote, which Werkzeug 3 removed
# https://stackoverflow.com/questions/77213053/why-did-flask-start-failing-with-importerror-cannot-import-name-url-quote-fr
# >= 2.3.5: older versions build their URL rules with ast.Str, which Python 3.14 removed
Werkzeug = ">=2.3.5,<3"
# https://stackoverflow.com/questions/78348773/how-to-resolve-np-float-was-removed-in-the-numpy-2-0-release-use-np-float64
# (networkx 2.5, pinned by probably, needs numpy < 2; 1.26.4 has no wheels for Python >= 3.13 and is built from source there)
numpy = "1.26.4"
# 0.14 has wheels for Python 3.14
symengine = "^0.14.0"
setuptools = "^76.0.0"

[tool.poetry.dev-dependencies]
# pytest 7.2 rewrites assertions with ast.Str, which Python 3.14 removed; 8.4 is the first release for 3.14
pytest = ">=8.4"
pylint = "^2.5.2"
mypy = ">0.770"
yapf = "^0.30.0"
# sphinx-autodoc-typehints = "^1.25.3"
# sphinx-bootstrap-theme = "^0.8.1"
# https://stackoverflow.com/questions/77848565/# sphinxcontrib-applehelp-breaking-# sphinx-builds-with-# sphinx-version-less-than-5-0
# sphinxcontrib-applehelp="2.0.0"
# sphinxcontrib-devhelp="2.0.0"
# sphinxcontrib-htmlhelp="2.1.0"
# sphinxcontrib-qthelp="2.0.0"
# sphinxcontrib-serializinghtml="2.0.0"
# sphinx-click = "^5.0.0"
# sphinx-git = "11.0.0"
jinja2 = "3.1.4"
rope = "^0.17.0"
# pytest-cov < 5 uses hook markers that pytest 9 deprecates and pytest 10 removes
pytest-cov = ">=5"
# hypothesis 5 registers a pytest plugin that fails to load on Python >= 3.12 (importlib.metadata)
hypothesis = ">=6"

[tool.poetry.scripts]
prodigy = "prodigy.cli:cli"
web-service = "prodigy.web.web_equivalence:start_server"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
