name: Fuzzing

# A larger run of the property-based tests in tests/fuzzing (the CI runs a few derandomized
# programs only). Every run draws new programs; a failure prints the shrunk program and how to
# reproduce it. Runs weekly and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  fuzz:
    name: fuzzing (many programs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      # each program has a time budget of 60 s; the slow examples need more than the default 120 s per test
      - run: make fuzz ARGS="--timeout=3600 --hypothesis-show-statistics"
        env:
          PRODIGY_FUZZ: nightly
