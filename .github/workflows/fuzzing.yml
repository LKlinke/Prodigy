name: Fuzzing

# A larger run of the property-based tests in tests/fuzzing (the CI runs a few derandomized
# programs only). Every run draws new programs; a failure prints the shrunk program and how to
# reproduce it. Runs weekly and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  fuzz:
    name: fuzzing (many programs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      # Each program and example runs in a child process with a time budget (60 s per program, 900 s per
      # example) and a memory limit, and fails on its own when it exceeds them. The tests themselves need
      # more than the default 120 s; -v names every finished test, --durations the slowest ones. The
      # 400-program test runs longer than 10 minutes, so the faulthandler dump is moved past it.
      - run: make fuzz ARGS="--timeout=3600 -o faulthandler_timeout=3000 -v --durations=20 --hypothesis-show-statistics"
        env:
          PRODIGY_FUZZ: nightly
