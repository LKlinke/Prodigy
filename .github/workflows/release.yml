# Publishes a release when a tag v<version> is pushed (the version in pyproject.toml, e.g. v3.1.0).
# The PyPI trusted publisher of prodigy-ppl is set up for this file name and the environment
# "release"; renaming either breaks publishing.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions: { }

env:
  UV_LOCKED: "1"

jobs:
  tests:
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read

  dist:
    name: build distributions
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          echo "tag: ${GITHUB_REF_NAME}, pyproject.toml: ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: uv build
      - name: Install the wheel and analyse a program with SymPy and with GiNaC
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/prodigy main example.pgcl
          /tmp/smoke/bin/prodigy --engine ginac main example.pgcl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14

  pypi:
    name: publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers approve the release here; the jobs below wait for this one.
    environment:
      name: release
      url: https://pypi.org/project/prodigy-ppl/
    permissions:
      # trusted publishing, no token
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docker:
    name: Docker image on ghcr.io
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 for Macs with Apple silicon
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lklinke/prodigy
          # 3.1.0, 3.1 and latest (pre-releases get only their version)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: GitHub release
    needs: [ pypi, docker ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release with generated notes and the distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes

  docs:
    name: documentation on GitHub Pages
    needs: github-release
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
