name: Set up Prodigy
description: Installs GiNaC, uv and Python, then the dependencies exactly as locked in uv.lock.

inputs:
  python-version:
    description: Python version to test with
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Install GiNaC
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q libginac-dev

    - name: Install uv and Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        # Built wheels (pygin; numpy on Python >= 3.13) are cached per Python version.
        enable-cache: true
        cache-suffix: py${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --locked
