name: Set up Prodigy
description: Installs uv and Python, then the dependencies exactly as locked in uv.lock.

inputs:
  python-version:
    description: Python version to test with
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Install uv and Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        # The downloaded and built wheels are cached per Python version.
        enable-cache: true
        cache-suffix: py${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --locked
